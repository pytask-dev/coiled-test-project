[project]
name = "project"
version = "0.1.0"
description = "A project to test coiled."
authors = [
    { name = "Tobias Raabe", email = "raabe@posteo.de" }
]
dependencies = [
    "pytask>=0.4.5",
    "pytask-parallel>=0.4.1",
    "s3fs>=2024.3.1",
]
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
coiled = [
    "coiled",
]
dask = [
    "dask[distributed]",
]
test = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
typing = ["ty>=0.0.91"]

[tool.uv.sources]
pytask = { git = "https://github.com/pytask-dev/pytask.git", branch = "main" }
pytask-parallel = { git = "https://github.com/pytask-dev/pytask-parallel.git", branch = "main" }

[tool.ty.terminal]
error-on-warning = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
fix = true
unsafe-fixes = true

[tool.ruff.lint]
extend-ignore = [
    "ANN401",  # flake8-annotate typing.Any
    "CPY001",  # Copyright notices are not required.
    "COM812",  # Comply with ruff-format.
    "ISC001",  # Comply with ruff-format.
    "D",
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"src/*" = ["S101"]
"tests/*" = ["D", "ANN", "PLR2004", "S101"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytask.ini_options]
